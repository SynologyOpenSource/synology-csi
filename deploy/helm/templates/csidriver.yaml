{{- if $.Values.installCSIDriver }}
---
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  labels: {{- include "synology-csi.labels" $ | nindent 4 }}
  name: csi.san.synology.com
spec:
  attachRequired: true # Indicates the driver requires an attach operation (ControllerPublishVolume is a no-op, but it keeps a VolumeAttachment until the node has unstaged)
  podInfoOnMount: true
  volumeLifecycleModes:
    - Persistent
{{- end }}
